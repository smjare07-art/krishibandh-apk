<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Krishibandh</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<!-- SPLASH SCREEN -->
<div id="splash">
  <div class="logo-circle">
    <img src="../img/Logo.png" alt="Krishibandh">
  </div>
  <h1>Krishibandh</h1>
  <div class="loader"></div>
</div>

<!-- LANGUAGE SCREEN -->
<div id="language">
  <div class="header">Krishibandh</div>

  <div class="card">
    <div class="logo-circle border">
      <img src="../img/Logo.png">
    </div>

    <h2>Select Language</h2>

    <div class="lang-btn" onclick="selectLang('mr')">
      <div class="icon">म</div>
      <span>मराठी</span>
    </div>

    <div class="lang-btn" onclick="selectLang('en')">
      <div class="icon">E</div>
      <span>ENGLISH</span>
    </div>

    <div class="lang-btn" onclick="selectLang('hi')">
      <div class="icon">हि</div>
      <span>हिंदी</span>
    </div>
  </div>
</div>

<script src="../js/app.js"></script>
</body>
</html>
