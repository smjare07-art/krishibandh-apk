<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <title>Crop Disease Detection</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<h2>🌾 Crop Disease Detection</h2>

<input type="file" accept="image/*" onchange="previewImage(event)">
<br><br>
<img id="preview" width="200" style="display:none;">
<br><br>

<button onclick="analyzeImage()">🔍 Analyse Crop</button>

<h3 id="resultText"></h3>
<p id="suggestionText"></p>

<script>
let selectedFile;

function previewImage(event) {
  selectedFile = event.target.files[0];
  const img = document.getElementById("preview");
  img.src = URL.createObjectURL(selectedFile);
  img.style.display = "block";
}

async function analyzeImage() {
  if (!selectedFile) {
    alert("फोटो निवडा");
    return;
  }

  const formData = new FormData();
  formData.append("image", selectedFile);

  document.getElementById("resultText").innerText = "⏳ analysing...";

  try {
    const res = await fetch("https://krishibandh-cropanaliys.onrender.com/predict", {
      method: "POST",
      body: formData
    });

    const data = await res.json();

    if (data.error) {
      document.getElementById("resultText").innerText = "❌ " + data.error;
      return;
    }

    document.getElementById("resultText").innerText =
      "🦠 " + data.disease + " (" + data.confidence + "%)";
  } catch (err) {
    document.getElementById("resultText").innerText = "❌ Server Error";
    console.log(err);
  }
}

</script>

</body>
</html>
