<!DOCTYPE html>
<html>
<head>
    <title>Deal Payment</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body style="text-align:center; margin-top:100px; font-family:Arial;">

    <h1>Deal Payment</h1>
    <h2 id="dealAmount">Loading...</h2>

    <button id="pay-btn" style="padding:10px 20px; font-size:18px;">
        Pay Now
    </button>

<script>
const BASE_URL = "https://krishibandh-backend.onrender.com";

const params = new URLSearchParams(window.location.search);
const appId = params.get("appId");

let finalAmount = 0;

async function loadDeal() {

    if (!appId) {
        alert("Invalid Application ID");
        return;
    }

    const res = await fetch(`${BASE_URL}/application/${appId}`);
    const data = await res.json();

    finalAmount = data.finalPrice;

    document.getElementById("dealAmount").innerText =
        "Final Amount: ₹" + finalAmount;
}

loadDeal();


document.getElementById("pay-btn").onclick = async function () {

    if (!finalAmount) {
        alert("Amount not loaded yet");
        return;
    }

    const response = await fetch(`${BASE_URL}/create-order`, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            amount: finalAmount
        })
    });

    const order = await response.json();

    var options = {
        key: "rzp_test_SGtadFAcSDWJxt",  // ⚠ LIVE karaycha asel tar live key tak
        amount: finalAmount * 100,
        currency: "INR",
        name: "Krishibandh Deal",
        description: "Final Deal Payment",
        order_id: order.id,

        handler: async function (response) {

            await fetch(`${BASE_URL}/payment/success/${appId}`, {
                method: "PUT"
            });

            alert("Payment Successful!");
            window.location.href = "../html/dealhistory.html";
        }
    };

    var rzp = new Razorpay(options);
    rzp.open();
};
</script>

</body>
</html>
