<!DOCTYPE html>
<html>
<head>
    <title>Razorpay Payment</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body style="text-align:center; margin-top:100px; font-family:Arial;">

    <h1>My App Payment</h1>
    <button id="pay-btn" style="padding:10px 20px; font-size:18px;">
        Pay ₹500
    </button>

    <script>
        document.getElementById("pay-btn").onclick = async function () {

            const response = await fetch("http://localhost:5001/create-order", {
                method: "POST"
            });

            const order = await response.json();

            var options = {
                key: "rzp_test_SGtadFAcSDWJxt", 
                amount: order.amount,
                currency: "INR",
                name: "My App",
                description: "Test Payment",
                order_id: order.id,

                handler: function (response) {
                    alert("Payment Successful!");
                    console.log(response);
                },

                theme: {
                    color: "#3399cc"
                }
            };

            var rzp = new Razorpay(options);
            rzp.open();
        };
    </script>

</body>
</html>
