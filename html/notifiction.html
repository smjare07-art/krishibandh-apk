<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <title>📩 Notifications</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 15px;
    }
    h2 {
      text-align: center;
    }
    .card {
      background: #fff;
      border-radius: 8px;
      padding: 12px;
      margin: 12px 0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .accepted {
      border-left: 6px solid green;
    }
    .rejected {
      border-left: 6px solid red;
    }
    .pending {
      border-left: 6px solid orange;
    }
    .status {
      font-weight: bold;
      margin-bottom: 5px;
    }
    .time {
      font-size: 12px;
      color: #666;
    }
    button {
      width: 100%;
      padding: 10px;
      margin-top: 15px;
      font-size: 16px;
    }
  </style>
</head>

<body>

<h2>🔔 Company Notifications</h2>

<div id="notificationList">
  ⏳ Loading notifications...
</div>

<button onclick="window.location.href='home.html'">⬅ Back to Home</button>

<script type="module">
  import { getAuth, onAuthStateChanged } from
  "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";

  import {
    getFirestore,
    collectionGroup,
    onSnapshot
  } from
  "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

  import { initializeApp } from
  "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";

  // 🔥 Firebase config
  const firebaseConfig = {
    apiKey: "AIzaSyD730G2BHy745j76Kyul4rU78-TOEJlSs8",
    authDomain: "login-app-7a350.firebaseapp.com",
    projectId: "login-app-7a350",
    storageBucket: "login-app-7a350.firebasestorage.app",
    messagingSenderId: "238192589278",
    appId: "1:238192589278:web:48bdc337889946f44e054f"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const container = document.getElementById("notificationList");

  // 🔐 Auth check
  onAuthStateChanged(auth, (user) => {
    if (!user) {
      window.location.href = "index.html";
      return;
    }

    // 🔔 Listen to farmer applications (LIVE)
    onSnapshot(
      collectionGroup(db, "applications"),
      (snapshot) => {

        container.innerHTML = "";
        let found = false;

        snapshot.forEach(docu => {
          if (docu.id === user.uid) {
            found = true;
            const d = docu.data();

            const statusClass =
              d.status === "accepted" ? "accepted" :
              d.status === "rejected" ? "rejected" :
              "pending";

            container.innerHTML += `
              <div class="card ${statusClass}">
                <div class="status">Status: ${d.status.toUpperCase()}</div>
                <div>📢 ${d.companyMessage || "payment option under devlopmet "}</div>
                <div class="time">
                  🕒 ${d.updatedAt?.toDate
                    ? d.updatedAt.toDate().toLocaleString()
                    : ""}
                </div>
              </div>
            `;
          }
        });

        if (!found) {
          container.innerHTML = " No notifications yet";
        }
      }
    );
  });
</script>

</body>
</html>
