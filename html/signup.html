<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <title>Signup</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      margin:0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg,#1f7a3f,#2ecc71);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .box{
      background:#fff;
      padding:25px;
      width:100%;
      max-width:360px;
      border-radius:15px;
      box-shadow:0 8px 20px rgba(0,0,0,0.2);
    }
    h2{
      text-align:center;
      margin-bottom:20px;
      color:#1f7a3f;
    }
    input, select{
      width:100%;
      padding:10px;
      margin-bottom:12px;
      border-radius:8px;
      border:1px solid #ccc;
      font-size:14px;
    }
    button{
      width:100%;
      padding:12px;
      border:none;
      border-radius:8px;
      background:#1f7a3f;
      color:#fff;
      font-size:16px;
      cursor:pointer;
    }
    button:hover{
      background:#166534;
    }
    .note{
      text-align:center;
      margin-top:12px;
      font-size:13px;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>Signup</h2>

  <input id="username" placeholder="Name">
  <input id="email" placeholder="Email">
  <input id="phone" placeholder="Phone">
  <input type="file" id="profileImage" accept="image/*">
  <!-- PINCODE BASED LOCATION -->
  <input id="pincode" placeholder="Pincode (6 digit)" maxlength="6">

  <input id="state" placeholder="State" readonly>
  <input id="district" placeholder="District" readonly>

  <select id="village">
    <option value="">Select Village</option>
  </select>

  <input id="password" type="password" placeholder="Password">
  <input id="confirmPassword" type="password" placeholder="Confirm Password">

  <button onclick="signup()">Signup</button>

  <div class="note">
    Already have account? <a href="index.html">Login</a>
  </div>
</div>

<!-- JS FILE -->
<script  src="../js/signup.js"></script>
<!-- <script type="module" src="../js/auth.js"></script> -->

</body>
</html>
